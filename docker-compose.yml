version: "3.9"

services:

  # ─── MongoDB ──────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: research-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db    # persist data between restarts
    networks:
      - research-network

  # ─── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: research-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data       # persist queue jobs between restarts
    networks:
      - research-network

  # ─── Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: research-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # Uses Docker service names as hostnames — not localhost
      MONGO_URI: mongodb://mongo:27017/ai-research-agent
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      - mongo
      - redis
    networks:
      - research-network

  # ─── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL}
    container_name: research-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - research-network

# ─── Volumes ──────────────────────────────────────────────────
volumes:
  mongo-data:
  redis-data:

# ─── Network ──────────────────────────────────────────────────
# Custom bridge network so containers talk to each other by name
networks:
  research-network:
    driver: bridge